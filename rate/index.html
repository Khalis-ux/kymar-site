<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0b0f">
<title>Rate Kymar</title>
<link rel="stylesheet" href="../styles.css">
<!--
  Jumps straight to the App Store review composer. The app's "Vota Kymar"
  button (YouView.swift) points here, so this single file routes users to
  the App Store with no app-side change. `?action=write-review` opens the
  review sheet directly.
-->
<meta http-equiv="refresh"
      content="0; url=https://apps.apple.com/app/id6772418602?action=write-review">
<link rel="canonical" href="https://apps.apple.com/app/id6772418602?action=write-review">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="../" class="brand">
      <img class="brand-mark" src="../favicon-32.png" alt="" width="28" height="28" decoding="async">
      <span class="brand-name">Kymar</span>
    </a>
  </div>
</header>
<main class="center-page">
  <h1>Thanks!</h1>
  <p>Taking you to the App Store to leave a review…<br>
     If nothing happens,
     <a href="https://apps.apple.com/app/id6772418602?action=write-review">tap here</a>.</p>
  <a href="../" class="btn-home">Back to home</a>
</main>
</body>
</html>
